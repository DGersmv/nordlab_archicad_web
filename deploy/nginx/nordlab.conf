# /etc/nginx/sites-available/nordlab
# Replace YOUR_SERVER_IP checks after DNS propagates.
# SSL: certbot --nginx -d nordlab.net -d www.nordlab.net -d pay.nordlab.net

upstream nordlab_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nordlab.net www.nordlab.net pay.nordlab.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nordlab.net www.nordlab.net pay.nordlab.net;

    # certbot fills these paths:
    ssl_certificate     /etc/letsencrypt/live/nordlab.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nordlab.net/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://nordlab_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
